<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Huellero</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    .box { background: white; padding: 20px; display: inline-block; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Control Lector DigitalPersona</h2>
    <button onclick="probarConexion()">Probar Conexión USB</button>
    <div id="status">Presiona el botón para iniciar.</div>
  </div>

  <script>
    function probarConexion() {
      const status = document.getElementById('status');
      status.innerText = "Buscando servicio DigitalPersona en puerto 8000...";

      const ws = new WebSocket('ws://127.0.0.1:8000/dp/events');

      ws.onopen = function() {
        status.style.color = "green";
        status.innerText = "¡Lector/Servicio detectado correctamente!";
      };

      ws.onerror = function(err) {
        status.style.color = "red";
        status.innerText = "No se pudo conectar al servicio local (Revisa que Web SDK esté ejecutándose).";
      };
    }
  </script>

</body>
</html>
