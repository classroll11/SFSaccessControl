<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(10, 5)">
    <!-- Outer Shield Halo -->
    <path d="M 30 3 L 52 14 C 52 35, 42 48, 30 55 C 18 48, 8 35, 8 14 Z" fill="#0a1128" stroke="url(#shieldGrad)" stroke-width="2.5" />
    
    <!-- Tech Nodes / Circuit Accents -->
    <path d="M 4 28 L 12 28 M 48 28 L 56 28 M 30 55 L 30 59" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    <circle cx="4" cy="28" r="2" fill="#00f2fe" />
    <circle cx="56" cy="28" r="2" fill="#00f2fe" />

    <!-- Glowing Fingerprint Vector Curves -->
    <g transform="translate(17, 15) scale(0.65)" stroke="url(#glowGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#cyanGlow)">
      <!-- Outer Arcs -->
      <path d="M 6 25 C 6 12, 14 4, 20 4 C 26 4, 34 12, 34 25 C 34 32, 32 37, 30 40" />
      <!-- Mid Arcs -->
      <path d="M 11 27 C 11 16, 15 9, 20 9 C 25 9, 29 16, 29 27 C 29 33, 27 38, 25 41" />
      <!-- Inner Core -->
      <path d="M 16 28 C 16 22, 18 15, 20 15 C 22 15, 24 22, 24 28 C 24 35, 22 39, 20 42" />
      <path d="M 20 23 L 20 30" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(76, 26)">
    <!-- Main SFS Title -->
    <text x="0" y="7" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="22" fill="url(#textGrad)" letter-spacing="-0.5">
      SFS <tspan fill="#2563eb">ACCESS</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#64748b" letter-spacing="2.2">
      CONTROL &amp; BIOMETRÍA
    </text>
    
    <!-- Decorative Tech Dot -->
    <circle cx="162" cy="3" r="3.5" fill="#00f2fe" />
  </g>
</svg>
